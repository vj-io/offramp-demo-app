name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      # uv reads .python-version (3.12) and installs that interpreter.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
